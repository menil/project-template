# Lets a maintainer ask for an issue to be assessed and, if it is real and reproducible,
# fixed as a DRAFT pull request, with the actions from menil/pr-code-review-action
# (pinned to the v1.3.0 commit). Read "Issue implementation" in that repository's README
# first. It needs the repository setting "Allow GitHub Actions to create and approve pull
# requests" (`just setup-github` turns it on, with the two labels), it uses the Claude
# subscription token, and the model only ever runs the commands named below.
#
# It starts only when someone with write access applies the ready-to-implement label. To
# have a maintainer's own new issues worked on automatically, set the repository variable
# AGENT_AUTO to true; it is off. Add the no-agent label to keep the agent off an issue.
#
# EDIT the two command_tools and the two repository_notes below for this project.
name: Implement issue

on:
  issues:
    types: [opened, labeled]

# Nothing by default: each job asks for exactly what it needs, and none asks for `workflows`.
permissions: {}

# One run per issue, queued and never cancelled halfway.
concurrency:
  group: implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assess:
    # Decided before any model runs, from the event alone. See the template's comments in
    # menil/pr-code-review-action (implement/example-workflow.yml).
    if: >-
      github.event.issue.user.type != 'Bot'
      && !contains(github.event.issue.labels.*.name, 'no-agent')
      && !contains(join(github.event.issue.labels.*.name, ','), 'repro:')
      && (
        (github.event.action == 'opened'
          && vars.AGENT_AUTO == 'true'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
        || (github.event.action == 'labeled'
          && github.event.label.name == 'ready-to-implement')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      verdict: ${{ steps.assess.outputs.verdict }}
      capped: ${{ steps.assess.outputs.capped }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The project's tools come from its Nix shell, so the model's commands run there.
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Assess the issue
        id: assess
        uses: menil/pr-code-review-action/implement/assess@a1aa172600e2df2c3f39fbca2fb5346e408c847f # v1.3.0
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          issue_number: ${{ github.event.issue.number }}
          # Only when a label started the run: that person must have write access.
          actor_login: ${{ github.event.action == 'labeled' && github.event.sender.login || '' }}
          # At most this many assessments per 24 hours; 5 if the variable is not set.
          daily_cap: ${{ vars.AGENT_DAILY_CAP }}
          # EDIT: the only command the assessor may run, besides reading files. Name the
          # narrowest one that runs this project's tests.
          command_tools: "Bash(nix-shell --run 'just validate')"
          repository_notes: |
            EDIT: say what this project is and where its code and tests are. Run the
            project's checks with `nix-shell --run 'just validate'`, exactly like that.

  report:
    needs: assess
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      proceed: ${{ steps.report.outputs.proceed }}
    steps:
      - name: Write the assessment
        id: report
        if: needs.assess.outputs.capped != 'true'
        uses: menil/pr-code-review-action/implement/report@a1aa172600e2df2c3f39fbca2fb5346e408c847f # v1.3.0
        with:
          issue_number: ${{ github.event.issue.number }}
          verdict: ${{ needs.assess.outputs.verdict }}

      - name: Say the daily limit was reached
        if: needs.assess.outputs.capped == 'true'
        uses: menil/pr-code-review-action/implement/notify@a1aa172600e2df2c3f39fbca2fb5346e408c847f # v1.3.0
        with:
          issue_number: ${{ github.event.issue.number }}
          kind: capped
          daily_cap: ${{ vars.AGENT_DAILY_CAP }}

  fix:
    needs: [assess, report]
    if: needs.report.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fix the issue and open a draft pull request
        uses: menil/pr-code-review-action/implement/fix@a1aa172600e2df2c3f39fbca2fb5346e408c847f # v1.3.0
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          issue_number: ${{ github.event.issue.number }}
          actor_login: ${{ github.event.action == 'labeled' && github.event.sender.login || '' }}
          # EDIT: the commands that check a change, so it can be made to pass the
          # project's own validation.
          command_tools: "Bash(nix-shell --run 'just validate')"
          repository_notes: |
            EDIT: say what this project is and where its code and tests are. Check a change
            with `nix-shell --run 'just validate'`, exactly like that. Add a regression test
            next to the existing ones for any behaviour you change.

  # One comment, once per issue, if any stage above failed, so a failure is not silent.
  notify:
    needs: [assess, report, fix]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Say the run failed
        uses: menil/pr-code-review-action/implement/notify@a1aa172600e2df2c3f39fbca2fb5346e408c847f # v1.3.0
        with:
          issue_number: ${{ github.event.issue.number }}
          kind: failed
